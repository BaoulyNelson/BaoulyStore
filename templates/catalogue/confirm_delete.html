{% extends 'base.html' %}

{% block title %}Supprimer — {{ produit.get_nom_display }}{% endblock %}

{% block content %}
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-6 text-center">
      <div class="card shadow-sm border-danger">
        <div class="card-body p-5">
          <i class="fas fa-trash-alt fa-3x text-danger mb-3"></i>
          <h4>Supprimer ce produit ?</h4>
          <p class="text-muted">« {{ produit.get_nom_display }} » sera définitivement supprimé.</p>
          <form method="post" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger me-2">Oui, supprimer</button>
          </form>
          <a href="{% url 'catalogue:liste' %}" class="btn btn-outline-secondary">Annuler</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
