{% extends 'base.html' %}
{% load static crispy_forms_tags %}

{% block title %}Modifier — {{ produit.get_nom_display }}{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/ajouter.css' %}">
{% endblock %}

{% block content %}
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card shadow-sm">
        <div class="card-header bg-warning">
          <h4 class="mb-0"><i class="fas fa-edit me-2"></i>Modifier : {{ produit.get_nom_display }}</h4>
        </div>
        <div class="card-body p-4">
          <form method="post" enctype="multipart/form-data" novalidate>
            {% csrf_token %}
            {{ form|crispy }}
            <div class="d-flex gap-2 mt-4">
              <button type="submit" class="btn btn-warning">
                <i class="fas fa-save me-1"></i>Enregistrer
              </button>
              <a href="{% url 'catalogue:detail' produit.pk %}" class="btn btn-outline-secondary">Annuler</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
