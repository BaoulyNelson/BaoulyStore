{% extends 'auth_base.html' %}
{% load crispy_forms_tags %}

{% block title %}Changer le mot de passe{% endblock %}

{% block content %}
<div class="auth-card card shadow p-4">
  <h4 class="mb-4 text-center">Changer le mot de passe</h4>
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-dark w-100 mt-3">Enregistrer</button>
  </form>
</div>
{% endblock %}
